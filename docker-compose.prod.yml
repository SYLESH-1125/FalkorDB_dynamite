# Production stack for the BHUMI backend (Postgres + pgvector, MinIO, Neo4j, API).
# The frontend is NOT here — it is deployed separately to Vercel.
#
#   cp .env.example .env   # then fill in JWT_SECRET, API keys, admin creds
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Datastore ports are bound to localhost only; put the backend behind a TLS
# reverse proxy (Caddy / Nginx / Traefik) and point NEXT_PUBLIC_API_URL at it.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bhumi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bhumi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-bhumi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bhumi} -d ${POSTGRES_DB:-bhumi}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: bhumi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: bhumi-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb -p local/${S3_BUCKET:-bhumi-documents} &&
      exit 0"
    restart: "no"

  neo4j:
    image: neo4j:5-community
    container_name: bhumi-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: bhumi-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bhumi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bhumi}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-bhumi-documents}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set to your Vercel URL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-4.5}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      BOOTSTRAP_ADMIN_EMPLOYEE_ID: ${BOOTSTRAP_ADMIN_EMPLOYEE_ID:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      DEMO_PARLIAMENTARY_EMPLOYEE_ID: ${DEMO_PARLIAMENTARY_EMPLOYEE_ID:-}
      DEMO_PARLIAMENTARY_PASSWORD: ${DEMO_PARLIAMENTARY_PASSWORD:-}
      DEMO_MINISTRY_EMPLOYEE_ID: ${DEMO_MINISTRY_EMPLOYEE_ID:-}
      DEMO_MINISTRY_PASSWORD: ${DEMO_MINISTRY_PASSWORD:-}
      DEMO_DOMAIN_OFFICER_EMPLOYEE_ID: ${DEMO_DOMAIN_OFFICER_EMPLOYEE_ID:-}
      DEMO_DOMAIN_OFFICER_PASSWORD: ${DEMO_DOMAIN_OFFICER_PASSWORD:-}
      DEMO_ADMIN_EMPLOYEE_ID: ${DEMO_ADMIN_EMPLOYEE_ID:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface

volumes:
  pgdata:
  minio_data:
  neo4j_data:
  hf_cache:
