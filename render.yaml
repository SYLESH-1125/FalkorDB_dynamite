# Free deploy of Company Brain.
# Frontend: Vercel, root directory `frontend`.
# This file: one Render free web service. FalkorDB runs inside that container.
# Postgres: a free Supabase project. Paste its direct (port 5432) connection string.
#
# Render Dashboard → New → Blueprint → this repo.
# Set every sync:false value when Render asks.

services:
  - type: web
    name: bhumi-company-brain
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile.free
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Supabase URI, postgresql://... Keep the direct host, port 5432.
      - key: DATABASE_SSL
        value: "true"
      - key: EMBEDDINGS_ENABLED
        value: "0"
      - key: FALKORDB_HOST
        value: 127.0.0.1
      - key: FALKORDB_PORT
        value: "6379"
      - key: FALKORDB_GRAPH
        value: bhumi_company_brain
      - key: S3_ENDPOINT_URL
        value: http://127.0.0.1:9000
      - key: S3_ACCESS_KEY
        value: unused
      - key: S3_SECRET_KEY
        value: unused
      - key: S3_BUCKET
        value: bhumi-documents
      - key: CORS_ORIGINS
        sync: false # exact Vercel origin, e.g. https://your-app.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_MINUTES
        value: "480"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: anthropic/claude-sonnet-4.5
      - key: BOOTSTRAP_ADMIN_EMPLOYEE_ID
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: DEMO_PARLIAMENTARY_EMPLOYEE_ID
        sync: false
      - key: DEMO_PARLIAMENTARY_PASSWORD
        sync: false
      - key: DEMO_MINISTRY_EMPLOYEE_ID
        sync: false
      - key: DEMO_MINISTRY_PASSWORD
        sync: false
      - key: DEMO_DOMAIN_OFFICER_EMPLOYEE_ID
        sync: false
      - key: DEMO_DOMAIN_OFFICER_PASSWORD
        sync: false
      - key: DEMO_ADMIN_EMPLOYEE_ID
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
